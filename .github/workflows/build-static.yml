name: Build LibreCorsa static mirror

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Next.js static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ONLINE_API: "/api"
          NEXT_PUBLIC_HOSTED_CONTENT: "1"
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: librecorsa-static
          path: out
          retention-days: 7
          include-hidden-files: true
